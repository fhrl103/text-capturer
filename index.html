<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ekstraksi Teks</title>
  <meta name="theme-color" content="#0F766E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1 dir="auto">Ekstraksi Teks</h1>
    <section id="empty-state" dir="auto">
      <p id="empty-message">Belum ada berkas. Pilih berkas PDF atau gambar dari perangkat.</p>
      <label for="file-input">Pilih berkas</label>
      <input type="file" id="file-input" accept="application/pdf,image/*">
    </section>
    <section id="file-info" hidden>
      <p dir="auto">Berkas terpilih: <span id="file-name" dir="auto"></span></p>
      <img id="preview" alt="" hidden>
      <canvas id="pdf-canvas" hidden></canvas>
      <p id="error-state" hidden dir="auto" role="alert"></p>
      <nav id="pdf-nav" hidden dir="auto" aria-label="Navigasi halaman">
        <button type="button" id="prev-page">Sebelumnya</button>
        <span id="page-indicator" dir="auto"></span>
        <button type="button" id="next-page">Berikutnya</button>
        <form id="jump-form">
          <label for="jump-input">Ke halaman</label>
          <input type="number" id="jump-input" min="1" inputmode="numeric">
          <button type="submit" id="jump-go">Buka</button>
        </form>
      </nav>
      <label for="file-input">Pilih berkas lain</label>
    </section>
  </main>
  <script src="js/fileLoader.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
